# Evidence-class registry: packet > video > wiki; archive is preservation-only.

classes:
- id: packet-capture
  tier: 1
  description: Retail packet captures (pcap corpus) and their canonical decode/digestion.
- id: video-breakdown
  tier: 2
  description: AI breakdowns distilled from retail 1.x gameplay videos.
- id: web-tables
  tier: 3
  description: Community 1.0-era web-source table transcriptions (stat growth, formulas).
- id: archive
  tier: null
  description: Source-preservation only; not ranked evidence (no tier).
- id: notes-and-transcripts
  tier: 2
  description: Freeform notes and transcripts; maps to the video-breakdown tier.

notes: 'Normalized transcription of the Gamer Escape FFXIV wiki''s 1.0-era item and mob data, mined from an 11,227-page raw-wikitext corpus. content_kind is the slug''s kind; the payload is item / mob / spawn reference data and is reached through tags. Evidence tier: wiki (packet captures > video breakdown > wiki), so values are CALIBRATION-grade - check xivl-client-data first for anything the client itself ships (item and mob names, ids, and much of the numeric stat block are primary evidence there). What this set carries that no live FFXIV wiki documents: per-item patch_introduced (1,087 of 5,665 items, including the sub-patches 1.19a, 1.20b, 1.22b and 1.22c that no longer appear anywhere), and removed_before_arr (2,593 of 5,665 items, from the source page''s Obsolete/PhasedOut template) marking 1.x content that did not survive into A Realm Reborn. Mined by walking brace-balanced {{Infobox Item}} / {{Infobox Mob}} / {{Mob Row}} / {{Infobox Mob Family}} calls and splitting depth-zero params, so nested templates do not truncate a field. Header names are this set''s normalized lower_snake_case forms with units carried in the name (delay_seconds, resale_price_gil, wear_durability_points, blunt_attack_pct), not the GE param names. items.csv was also joined by English item name to the client item tables in xivl-client-data to name their bare-integer columns; that product is derived/client-column-map.csv plus two mismatch lists, documented in derived/client-column-map-notes.md.'

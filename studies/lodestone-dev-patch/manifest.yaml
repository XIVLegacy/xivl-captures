notes: 'Clean Markdown transcription of the 1.x FINAL FANTASY XIV Lodestone dev communications and patch notes, harvested from the same Jan-2015 master archive as the manual set. 63 pages, ~55k words, 166 content images, one .md per page under sources/lodestone-dev-patch/objects/pages/, grouped by kind in derived/dev-patch-index.md. This is the patch-history / design-intent layer: what SE changed and why across patches 1.15-1.23 (auto-attack and enmity reform, fatigue-system removal, Raise/Return revisions, materia, guildleve reform, settlements, airships, instanced raids, NMs and primals), plus 17 Ask the Devs Q&A and 6 producer letters. Retained as first-party patch-history evidence and behavior/patch context. Evidence tier: first-party SE dev communication of design INTENT - stronger than community wiki, but it records what was announced/intended; observed packet/video evidence still outranks it for actual runtime values, and an announced change is intent until confirmed shipped in 1.23b. Prose and authored text are ASCII-normalized; two genuinely non-ASCII glyphs are kept verbatim as data (a yen sign in a flavor line, an accented letter in "a la mode"). The ~120 lore/event/ARR-transition pages and 12 Beginner''s Guide columns in the master rar are NOT harvested here.'

notes: >-
  Counts for every sent client-to-server 0x012d EventStart in the captures.
  Joins the selector byte, the server codes fields, and the event name, and
  counts the 0x00cc and 0x00cd target messages that precede each talkDefault.
  Actor ids, timestamps, and payload bytes stay out of the products. The
  job-change-context extension adds a bounded 0x01a4/request join and a full
  retained-corpus packed-selector scan.

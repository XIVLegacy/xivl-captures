notes: >-
  Bounded inventory of the canonical 1.23b session and zone-transition
  captures. login.pcapng contains TLS account traffic and raw lobby traffic;
  the latter provides packet/frame locators for a possible Blowfish body and
  for the clear initial client-number and ticket fields. The confirmed recipe
  hashes the full 44-byte zero-padded session field with MD5, uses Blowfish ECB
  with sign-extended key bytes, and recovers plaintext on both connections.
  The 1000 constant is confirmed; server-side comparison policy remains
  unverified.

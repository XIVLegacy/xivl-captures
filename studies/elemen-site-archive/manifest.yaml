notes: 'Consolidated verbatim HTML mirror of the eLeMeN - FF14 (elemen.sakura.ne.jp/ff14_dated_archives/) sections this project has digested, preserved at their true site paths under sources/elemen-site-archive/objects/ff14_dated_archives/. 271 files (270 HTML + the shop data file js/db_shop.js), bytes identical to source. eLeMeN preserves the final 1.x (patch 1.23b) data at the 2012-11-11 world-down and is the primary source behind every elemen-* set; this archive is its preservation/provenance copy. Scope is the sections worked on, not the whole site: monster/bestiary + monster/nm, class/action + class/battle + class/level, quest/{ClassQuest,JobQuest,MainQuest} detail pages, guildleve/regional battlecraft pages, etc/{area,shopitem,playguide,history,food,medicine}, and gamecontents/{InstancedRaids,PrimalBattle,StrongholdandDungeon,Materia, TheGrandCompanies,etc}. Site paths were reconstructed from each page''s breadcrumb (authoritative section) plus the cross-page link graph (exact filenames incl. apostrophes); derived/url-map.csv maps every archived file to its exact source URL. This is a duplicate-for-preservation - each page also lives in its originating set''s sources/<id>/objects/ as that set''s working evidence; this set is the browsable, path-faithful consolidation. Gaps: only pages we fetched are present (index-based sections effectively complete, detail-page sections partial); the gear/ section was evaluated-and-skipped and never fetched; images are not mirrored (separate ff14_archives/img/ subtree, mostly icons already decoded in xivl-client-data derived/icons-1.23b/); a few WAF-blocked resources (etc/playguide/server.html, gamecontents/index.html) were never fetchable. A planned English translation pass will read this JP mirror as input and land as a separate reference layer beside these originals. Built 2026-07-18.'

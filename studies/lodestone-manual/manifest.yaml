notes: 'Clean Markdown transcription of the official FINAL FANTASY XIV 1.0 Lodestone game manual, harvested from a local Jan-2015 archive of the (now defunct) 1.x Lodestone. 36 pages, ~45k words, 330 content images. One .md per page under sources/lodestone-manual/objects/pages/, page screenshots under sources/lodestone-manual/objects/images/. Unlike the standard web-tables intake (transcribe tables only, leave prose at source), this set preserves each page''s full prose, because the source is a dead site we hold only as a local archive and the manual''s mechanic descriptions are the value. Verbatim SE text stays here in the evidence layer; downstream consumers should reword facts rather than copy it. Evidence tier: this is SE''s OWN first-party manual, so it documents intended 1.x behavior authoritatively - stronger than community wiki, but it records design INTENT, and observed packet/video evidence still outranks it for actual runtime values (intent can diverge from what 1.23b shipped). See derived/evidence-map.md for the tier note and derived/wiki-target-index.md for the page-to-wiki-section map. The source archive contains all 208 pages, including the ~170 news/lore/patch/event pages NOT transcribed here; the dev/patch subset can be harvested later. Authored text and prose are normalized to ASCII; genuinely non-ASCII data cells are kept verbatim (the Materia grade-compat tables use a filled-circle yes-marker). The inline data tables are also normalized into derived/tables/ (19 CSVs, 481 rows: text commands, emotes, macro placeholders, keyboard controls, config options, classes, jobs, grand-company ranks, aetherial transport, incapacitation matrices, materia grades/catalysts, repair costs, achievement NPCs, main menu, more); each row carries a source_page column, and the CSVs are rebuilt from the rowspan-aware HTML because the Markdown flatten dropped some anchor rows.'

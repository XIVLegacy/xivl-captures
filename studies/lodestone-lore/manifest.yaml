notes: 'Clean Markdown transcription of the 1.x Lodestone lore/flavor pages, harvested from the same Jan-2015 master archive as the other lodestone sets. 63 pages, ~33k words, 152 images, one .md per page, grouped by kind in derived/index.md: Grand Company in-world newsletters (The Mythril Eye / Immortal Flames, The Raven / Twin Adder, The Harbor Herald / Maelstrom), The Last Word news serial tracking the Garlean advance and the road to the Calamity, and seasonal-event announcements. This is the lowest evidence tier - period lore and flavor, not mechanics - retained as first-party lore and seasonal-event evidence; downstream consumers should reword facts rather than copy source prose. The GC newsletters use an older Lodestone template (div.gc-news-detail-inner) rather than the guide/topics container. Prose is ASCII-normalized (decorative circle bullets mapped to "-", a stray ideographic comma to ","); three genuinely non-ASCII glyphs are kept verbatim in loanwords (the cedilla in "facade", the diaeresis in "naive"). This set completes the 1.x Lodestone harvest: the remaining ~34 master-rar pages are ARR-transition / billing / misc announcements, out of 1.23b scope.'

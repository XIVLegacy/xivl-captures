notes: 'Calibration run for the video-breakdown handoff prompt. AI breakdown of a retail 1.x video (vidssave.com FFXIV 1.0 Ifrit fight 1080P.mp4, ~12:40) of the Ifrit primal in The Bowl of Embers: the point-of-view player (Conjurer Lv30) in a four-player Light Party, one member tanking (player and party character names generalized to roles). Evidence tier: packet captures > video breakdown > wiki - no xivl-opcodes packet set covers Ifrit, so derived/evidence-map.md records verification against the xivl-client-data client strings instead. All five Ifrit readied actions (Vulcan Burst, Incinerate, Eruption, Crimson Cyclone, Hellfire) and Infernal Nail resolve to real 1.23b strings; zero hallucinations or ARR substitutions. Unique residual value: Ifrit damage magnitudes (auto-attack, Vulcan Burst, Eruption, Incinerate, Hellfire, Crimson Cyclone), heal/recovery amounts, the Siphon MP drain, and the fight pacing (Infernal Nail phase ~7:00, single Hellfire ~8:00). The source video is not archived.'

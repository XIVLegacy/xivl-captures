notes: 'Web-table transcription of the eLeMeN - FF14 (elemen.sakura.ne.jp) "データ資料 > クラス" section: the seven Disciplines of War/Magic action pages (class/action/~patch2.00_*) plus the shared class/battle tactics page (class/battle/, 付加効果を持つ戦術). Three derived CSVs: battle-actions.csv (226 rows: one per class action / job action / trait, with level, TP, cast, recast, effect duration, equip-condition, and the site description), part-damage-map.csv (15 rows: class x body-part -> weaponskill), and tactics-battle-regimen.csv (6 Battle Regimen combo-bonus effects). content_kind is action-mechanic; system battle-regimen. Evidence tier: wiki, so CALIBRATION-grade (packet captures > video breakdown > wiki). Client-first: xivl-client-data ships the action names + descriptions (xtx_command.csv) as primary evidence, and every EN here is joined from that sheet (JP col2 -> EN col3, id col0), not authored - 226/226 actions and 15/15 part-damage WS resolve to a client EN, zero authored (?). The numeric command.csv sheet is sparse (no TP/cast/duration/level), so this set''s unique value is those observation-only fields. Shared trait/action names carry one client id per class; the ids are assigned by canonical class order (Pugilist < Gladiator < Marauder < Archer < Lancer < Thaumaturge < Conjurer), never first-wins - see derived/evidence-map.md, which also logs the differing-EN twins (Power Surge/Speed Surge, Path of the Storm/Storm''s Path, Disembowel/Dragon''s Grasp, ...). ~patch2.00 is the site''s forward-facing label; the content is the final 1.x (patch 1.23b) state at the 2012-11-11 world-down, not ARR. The site 403s naive fetchers (curl/WebFetch); pages were read with a browser UA and captured into elemen-site-archive as the archival copy (web.archive Save-Page-Now not relied on). Source HTML preserved in elemen-site-archive, see its derived/url-map.csv. Crafter/gatherer action pages, the ~patch1.20/~patch1.22 historical snapshots (incl. the removed 盾術 class), and class/level are deliberately out of scope for a future intake. Harvested 2026-07-17.'

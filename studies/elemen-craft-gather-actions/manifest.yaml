notes: 'Web-table transcription of the eLeMeN - FF14 (elemen.sakura.ne.jp) "データ資料 > クラス" section for the non-combat classes: the 8 Disciples of the Hand (crafter) and 3 Disciples of the Land (gatherer) action pages (class/action/~patch2.00_*). Sibling to elemen-battle-actions (the 7 Disciplines of War/Magic); same pipeline and cross-check. One derived CSV: craft-gather-actions.csv (167 rows, 120 distinct names: one per class action / ability, with discipline hand/land, section アクション/ゴッドセンド, level, TP, cast, recast, duration, equip-condition, and the site description). content_kind is action-mechanic. Evidence tier: wiki, so CALIBRATION-grade (packet captures > video breakdown > wiki). Client-first: xivl-client-data ships the ability names + descriptions (xtx_command.csv) as primary evidence, and every EN here is joined from that sheet (JP col2 -> EN col3, id col0), not authored - 167/167 resolve, zero (?), zero misses; the crafting/gathering abilities are the client''s 29xxx command rows (295xx crafting, 297xx gathering), the general アクション actions the shared 22xxx rows. The abilities are shared within a discipline as a single client id (Hasty Hand = 29502 on every crafter page that lists it), not per-class copies, so the per-class id assignment was a no-op (0 twins, 0 ambiguous picks). This set''s web-unique value is the level-learned, the equip-condition grouping, and the アクション TP/cast/recast/duration - ゴッドセンド rows carry no TP/cast on the source page. ~patch2.00 is the site''s forward-facing label; the content is the final 1.x (patch 1.23b) state at the 2012-11-11 world-down, not ARR. The site 403s naive fetchers (curl/WebFetch); pages were read with a browser UA and captured into elemen-site-archive as the archival copy (web.archive Save-Page-Now not relied on). Source HTML preserved in elemen-site-archive, see its derived/url-map.csv. The ~patch1.20/~patch1.22 historical snapshots and class/level are out of scope for a future intake. Harvested 2026-07-18.'

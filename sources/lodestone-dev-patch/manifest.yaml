id: lodestone-dev-patch
title: FFXIV 1.x Lodestone Dev Posts and Patch Notes
evidence_class: web-tables
distribution: restricted
provenance:
  sources:
  - title: FINAL FANTASY XIV (1.x) Lodestone - Topics / News and Patch Notes
    site: lodestone.finalfantasyxiv.com (official 1.x Lodestone, defunct)
    snapshot: 2015-01 (saved-page timestamps in the archive)
    scope: '63 dev/patch pages under /pl/topics/ dated 2010-09-21 to 2012-07-10 (1.0 launch prep through late 1.x): patch notes, version-update briefings, battle reform posts, feature/system announcements, content/monster/primal posts, 17 Ask the Devs, 6 producer letters. Per-page topic URLs are in derived/file-inventory.csv (source_url column) - the single home for per-page provenance. Four 2013 ARR-beta pages in the archive (Beta Test Phase 4 x2, Materia System Revisions, Letter LIVE VIII) were excluded as out of 1.23b scope.'
    archive_url: null
    archive_note: The source site was retired with 1.0 in 2012; there are no live URLs to snapshot. The master archive below is the preservation copy.
    master_archive:
      file: Old Lodestone.rar
      sha256: 481c27e2738b0f552c754f3f25ca2028560cf13129b3b98f4b8b1028d5cbafee
      holds: all 208 saved Lodestone pages (manual + news + lore), Jan 2015 snapshot
      cold_store_path: archives/lodestone-manual/Old Lodestone.rar
      note: Same master .rar as the lodestone-manual set; cold-stored once under that set's archives/ dir (gitignored), not duplicated here.
storage:
  original_state: in-repo
  storage_id: repo
  path: objects/

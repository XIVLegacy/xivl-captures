id: lodestone-lore
title: FFXIV 1.x Lodestone Lore - GC Newsletters, The Last Word, Events
evidence_class: web-tables
distribution: restricted
provenance:
  sources:
  - title: FINAL FANTASY XIV (1.x) Lodestone - GC newsletters, The Last Word, seasonal events
    site: lodestone.finalfantasyxiv.com (official 1.x Lodestone, defunct)
    snapshot: 2015-01 (saved-page timestamps in the archive)
    scope: '63 lore/flavor pages: 30 Grand Company newsletters (The Mythril Eye 01-11, The Raven 01-09, The Harbor Herald 01-10), 12 The Last Word news-serial installments, 21 seasonal-event announcements. Per-page topic URLs are in derived/file-inventory.csv (source_url column). Event posts that carried battle content (Ifrit, Garuda, Good King Moggle Mog, Skirmish) live in the lodestone-dev-patch set, not here.'
    archive_url: null
    archive_note: The source site was retired with 1.0 in 2012; no live URLs to snapshot. The master archive below is the preservation copy.
    master_archive:
      file: Old Lodestone.rar
      sha256: 481c27e2738b0f552c754f3f25ca2028560cf13129b3b98f4b8b1028d5cbafee
      cold_store_path: archives/lodestone-manual/Old Lodestone.rar
      note: Same master .rar as the lodestone-manual / lodestone-dev-patch / lodestone-beginners sets; cold-stored once under the manual set's archives/ dir (gitignored), not duplicated here.

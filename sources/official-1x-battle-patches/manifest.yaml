id: official-1x-battle-patches
title: Official FFXIV 1.x battle patch notes
evidence_class: web-tables
distribution: restricted
provenance:
  publisher: Square Enix
  site: forum.square-enix.com/ffxiv
  scope: Selected original English official Patch Notes forum pages for patches 1.19, 1.20, 1.20a, 1.21,
    1.22 and 1.22a, plus the available page snapshots listed in members. This is not the complete thread
    or patch-history corpus.
  source_identity: Official NOC_NA and NOC_JP posts, identified by thread and post IDs in the study. Original
    publication display dates are distinct from retrieval and archive times. No independent per-post revision
    ID or display-time timezone was available.
  retention: Complete byte-preserved HTML responses; no text rewriting or image fetching. Restricted source
    objects are excluded from the public tree.
  archive_limit: No snapshot was returned for the exact 1.20a URL. The preserved 1.20 archive page contains
    only the opening post, not its selected reform/action/history posts. The study identifies each comparison
    scope. The preserved 1.22 snapshot contains opening post 660197, not selected Event post 660452. Selected
    1.22a post 682107 matched its preserved snapshot.
storage:
  original_state: in-repo
  storage_id: repo
  path: objects/
